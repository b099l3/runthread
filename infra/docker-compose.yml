services:
  postgres:
    image: postgres:16
    container_name: runthread-postgres
    environment:
      POSTGRES_DB: runthread
      POSTGRES_USER: runthread
      POSTGRES_PASSWORD: runthread
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runthread -d runthread"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

