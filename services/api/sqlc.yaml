version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "internal/postgres/migrations/000001_initial_core_schema.up.sql"
      - "internal/postgres/migrations/000002_provider_connections.up.sql"
    queries: "internal/postgres/queries"
    gen:
      go:
        package: "db"
        out: "internal/postgres/db"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_interface: true
        overrides:
          - db_type: "pg_catalog.numeric"
            go_type: "float64"
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type: "database/sql.NullFloat64"
