name: Backend CI

on:
  pull_request:
    paths:
      - ".github/workflows/backend-ci.yml"
      - "services/api/**"
      - "scripts/db/**"
      - "infra/**"
      - ".tool-versions"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backend-ci.yml"
      - "services/api/**"
      - "scripts/db/**"
      - "infra/**"
      - ".tool-versions"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Go tests and vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true
          cache-dependency-path: services/api/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

  backend-codegen:
    name: Generated code checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true
          cache-dependency-path: services/api/go.sum

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Cache codegen tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-codegen-tools-sqlc-1.31.1-buf-1.69.0-${{ runner.os }}

      - name: Install codegen tools
        run: |
          test -x "$(go env GOPATH)/bin/sqlc" || go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          test -x "$(go env GOPATH)/bin/buf" || go install github.com/bufbuild/buf/cmd/buf@v1.69.0

      - name: Lint protobuf
        run: buf lint

      - name: Regenerate database code
        run: sqlc generate

      - name: Regenerate RPC code
        run: buf generate

      - name: Check generated code is committed
        run: git diff --exit-code -- internal/postgres/db internal/rpc/runthread
