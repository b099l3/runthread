name: Database CI

on:
  pull_request:
    paths:
      - ".github/workflows/database-ci.yml"
      - "services/api/internal/postgres/migrations/**"
      - "scripts/db/**"
      - "infra/docker-compose.yml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/database-ci.yml"
      - "services/api/internal/postgres/migrations/**"
      - "scripts/db/**"
      - "infra/docker-compose.yml"

permissions:
  contents: read

concurrency:
  group: database-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Postgres migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: runthread
          POSTGRES_USER: runthread
          POSTGRES_PASSWORD: runthread
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runthread -d runthread"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: runthread
      PGUSER: runthread
      PGPASSWORD: runthread

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply migrations
        run: |
          set -euo pipefail
          for migration in services/api/internal/postgres/migrations/*.up.sql; do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Roll back migrations
        run: |
          set -euo pipefail
          for migration in $(find services/api/internal/postgres/migrations -maxdepth 1 -name "*.down.sql" | sort -r); do
            echo "Rolling back $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Reapply migrations
        run: |
          set -euo pipefail
          for migration in services/api/internal/postgres/migrations/*.up.sql; do
            echo "Reapplying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
